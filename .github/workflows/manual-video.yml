name: Manual Video (from GRACE)

run-name: ${{ github.event.inputs.title != '' && github.event.inputs.title || 'GRACE video' }}

on:
  workflow_dispatch:
    inputs:
      script_text:
        description: "Full script (scenes separated by a blank line) — or, if input_mode is 'idea', a one-line idea followed by one fact per line"
        type: string
        required: true
      title:
        description: "Video title (optional — first line used if blank)"
        type: string
        required: false
      visual_mode:
        description: "pictures (library photos + upload gate) or stickman (no library, fully hands-off)"
        type: choice
        options: ["pictures", "stickman"]
        default: "pictures"
        required: false
      input_mode:
        description: "script (script_text is a finished script) or idea (script_text is an idea + bullet facts for the free rule-based director to shape into a script)"
        type: choice
        options: ["script", "idea"]
        default: "script"
        required: false

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install system dependencies
        run: |
          # Tried caching this via a third-party action to save ~20-40s;
          # it restored ffmpeg without libblas.so.3 (a transitive dep),
          # breaking every build with a cryptic exit 127 deep in the
          # pipeline. Not worth the risk for the time saved — plain
          # apt-get is slower but always correct.
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-firacode fonts-dejavu-core espeak-ng
          ffmpeg -version >/dev/null
          ffprobe -version >/dev/null

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Turn pasted script (or idea) into a scene JSON
        id: segment
        continue-on-error: true
        env:
          # Passed as an env var, not interpolated into the shell command —
          # a pasted script containing quotes, backticks or $ would otherwise
          # break (or inject into) the generated shell line.
          SCRIPT_TEXT: ${{ github.event.inputs.script_text }}
          VIDEO_TITLE: ${{ github.event.inputs.title }}
          VIDEO_MODE: ${{ github.event.inputs.visual_mode }}
          INPUT_MODE: ${{ github.event.inputs.input_mode }}
        run: |
          cd src
          if [ "$INPUT_MODE" = "idea" ]; then
            python director.py ../scripts/manual_video.json
          else
            python segment_script.py ../scripts/manual_video.json
          fi

      - name: Build video
        id: build
        if: steps.segment.outcome == 'success'
        continue-on-error: true
        run: |
          cd src
          python build_video.py ../scripts/manual_video.json

      - name: Upload to YouTube
        id: upload
        if: steps.build.outcome == 'success'
        continue-on-error: true
        env:
          YOUTUBE_TOKEN_B64: ${{ secrets.YOUTUBE_TOKEN_B64 }}
          VIDEO_PRIVACY_STATUS: ${{ vars.VIDEO_PRIVACY_STATUS || 'private' }}
        run: |
          cd src
          python upload.py --video ../output/manual_video.mp4 --metadata ../scripts/manual_video.json

      - name: Upload video as a workflow artifact too (backup)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-${{ github.run_id }}
          path: output/*.mp4
          retention-days: 14
          if-no-files-found: ignore

      - name: Record result in history log
        if: always()
        env:
          SEGMENT_OUTCOME: ${{ steps.segment.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload.outcome }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          VIDEO_TITLE: ${{ github.event.inputs.title }}
        run: |
          cd src
          python log_result.py

      - name: Commit history log
        if: always()
        run: |
          git config user.name "grace-bot"
          git config user.email "grace-bot@users.noreply.github.com"
          git add data/history.json
          if git diff --cached --quiet; then
            echo "No history changes to commit."
          else
            git commit -m "Log GRACE run ${{ github.run_id }}"
            for i in 1 2 3; do
              git pull --rebase origin main && git push origin main && break
              sleep $((i * 3))
            done
          fi

      - name: Fail the run if a build step failed
        if: steps.segment.outcome == 'failure' || steps.build.outcome == 'failure' || steps.upload.outcome == 'failure'
        run: exit 1
